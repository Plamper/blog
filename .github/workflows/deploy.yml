name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ runner.os }}-nix-v2-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            ${{ runner.os }}-nix-v2-
          gc-max-store-size-linux: 512M

      - name: Build site with Nix flake
        run: |
          # Keep `tola` as a GC root so cache GC drops Rust build deps while keeping the `tola` binary
          nix build .#tola --out-link result-tola
          nix build
          rm -rf public
          cp -rL result public

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          # Deploys Cloudflare Workers Static Assets via wrangler.jsonc.
          # If using a legacy Cloudflare Pages project instead, replace with:
          # command: pages deploy public --project-name=blog
          command: deploy
