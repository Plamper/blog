{% extends "base.html" %}

{% block content %}
<a class="post-back" href="{{ get_url(path='@/blog/_index.md') | safe }}">← all posts</a>

<div class="post-header">
  <h1 id="post-title" data-title="{{ page.title }}"></h1>
  <p class="post-meta">{{ page.date | date(format="%B %d, %Y") }}</p>
</div>

<article class="prose">
  {{ page.content | safe }}
</article>
{% endblock content %}

{% block scripts %}
<script>
  (function() {
    const el = document.getElementById("post-title");
    const text = el.getAttribute("data-title");
    let i = 0;

    function type() {
      if (i <= text.length) {
        // Keep the cursor inside the H1 so it stays at the end of the line
        el.innerHTML = text.slice(0, i) + '<span class="cursor"></span>';
        i++;
        setTimeout(type, 50);
      }
    }
    type();
  })();
</script>
{% endblock scripts %}
